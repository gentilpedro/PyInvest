name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate - compile all sources
        run: python -m compileall -q app infra ui main.py build_app.py

      - name: Validate - import and instantiate the UI
        run: |
          python -c "from ui.main_window import MainWindow; w = MainWindow(); w.update(); w.destroy(); print('UI OK')"

      - name: Build executable
        run: python build_app.py

      - name: Bump version and push tag
        id: tag
        shell: pwsh
        run: |
          git fetch --tags --quiet

          $tags = git tag --list "v*.*.*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }

          if (-not $tags) {
            $nextTag = "v1.0.0"
          } else {
            $latest = $tags | ForEach-Object { [version]($_.Substring(1)) } | Sort-Object | Select-Object -Last 1
            $nextTag = "v$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          }

          Write-Host "Next tag: $nextTag"
          "new_tag=$nextTag" >> $env:GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $nextTag
          git push origin $nextTag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          files: dist/PyInvest.exe
